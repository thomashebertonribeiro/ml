[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ml-category-web-backend"
version = "0.1.0"
description = "ML Category Web — Backend FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.*",
    "uvicorn[standard]==0.30.*",
    "sqlalchemy[asyncio]==2.0.*",
    "alembic==1.13.*",
    "asyncpg==0.29.*",
    "pydantic[email]==2.7.*",
    "pydantic-settings==2.3.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[bcrypt]==1.7.*",
    "celery[redis]==5.4.*",
    "redis==5.0.*",
    "httpx==0.27.*",
    "structlog==24.*",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.*",
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==5.*",
    "httpx==0.27.*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
