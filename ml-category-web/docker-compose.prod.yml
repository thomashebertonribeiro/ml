version: "3.9"

# =============================================================================
# Production overrides — apply on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# SSL certificates are obtained via certbot standalone BEFORE running this.
# Run on the VPS:
#   apt-get install -y certbot
#   certbot certonly --standalone -d ml.brasilices.tech --email you@email.com --agree-tos
# =============================================================================

services:

  db:
    restart: unless-stopped
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    ports: []
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    command: celery -A app.workers.celery_app beat --loglevel=warning --scheduler celery.beat:PersistentScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    ports: []

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_build:/usr/share/nginx/html:ro

volumes:
  frontend_build:
