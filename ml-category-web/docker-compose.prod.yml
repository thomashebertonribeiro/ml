version: "3.9"

# =============================================================================
# Production overrides with Traefik integration.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =============================================================================

services:

  db:
    restart: unless-stopped
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    ports:
      - "8000:8000"
    networks:
      - mlnet
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ml-backend.rule=Host(`ml.brasilices.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.ml-backend.entrypoints=websecure"
      - "traefik.http.routers.ml-backend.tls=true"
      - "traefik.http.routers.ml-backend.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.ml-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.ml-backend.middlewares=ml-strip-api"
      - "traefik.http.services.ml-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.ml-backend.priority=10"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    networks:
      - mlnet
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=4

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    networks:
      - mlnet
    command: celery -A app.workers.celery_app beat --loglevel=warning --scheduler celery.beat:PersistentScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    volumes: []
    ports:
      - "3000:80"
    networks:
      - mlnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ml-frontend.rule=Host(`ml.brasilices.tech`)"
      - "traefik.http.routers.ml-frontend.entrypoints=websecure"
      - "traefik.http.routers.ml-frontend.tls=true"
      - "traefik.http.routers.ml-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ml-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.ml-frontend.priority=1"

networks:
  mlnet:
    driver: bridge
